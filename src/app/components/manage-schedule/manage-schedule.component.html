<div class="schedule-container">
  <div class="header-section">
    <div class="header-content">
      <h2 class="header-title">Manage Schedule</h2>
      <p class="header-subtitle">Set date-specific availability and respond to bookings.</p>
    </div>
    <button class="refresh-btn" (click)="loadSchedule()">
      <span class="icon-spin">↻</span>
      Refresh
    </button>
  </div>

  <div class="alert-container">
    <div class="alert">
      <div class="alert-icon">ℹ</div>
      <div class="alert-content">
        <p><strong>Tip:</strong> Drag on the calendar to add a slot for that date/time. Click an available slot to remove it.</p>
      </div>
    </div>
  </div>

  <div class="calendar-section">
    <div class="calendar-wrapper">
      <app-calendar
        [events]="calendarEvents"
        [editable]="true"
        [selectable]="true"
        (slotSelected)="onSlotSelected($event)"
        (eventClicked)="onEventClicked($event)">
      </app-calendar>
    </div>
  </div>

  <div class="modal-overlay" [class.active]="showAvailabilityModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h5 class="modal-title">Add Availability</h5>
        <button class="modal-close" (click)="closeAvailabilityModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" class="form-input" [(ngModel)]="availabilityForm.date">
        </div>

        <div class="form-group">
          <label class="form-label">Start Time</label>
          <input type="time" class="form-input" [(ngModel)]="availabilityForm.startTime">
        </div>

        <div class="form-group">
          <label class="form-label">End Time</label>
          <input type="time" class="form-input" [(ngModel)]="availabilityForm.endTime">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-cancel" (click)="closeAvailabilityModal()">Cancel</button>
        <button class="btn btn-save" (click)="saveAvailability()">Save Availability</button>
      </div>
    </div>
  </div>
</div>
