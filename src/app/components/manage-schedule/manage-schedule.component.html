<div class="schedule-container">
  <!-- Header Section -->
  <div class="header-section">
    <div class="header-content">
      <h2 class="header-title">Manage Schedule</h2>
      <p class="header-subtitle">Organize your availability and bookings efficiently</p>
    </div>
    <button class="refresh-btn" (click)="loadSchedule()">
      <span class="icon-spin">↻</span>
      Refresh
    </button>
  </div>

  <!-- Alert Section -->
  <div class="alert-container">
    <div class="alert">
      <div class="alert-icon">ℹ️</div>
      <div class="alert-content">
        <p><strong>Tip:</strong> Click and drag on the calendar to create availability slots. Click on a slot to remove
          it.</p>
      </div>
    </div>
  </div>

  <!-- Calendar Section -->
  <div class="calendar-section">
    <div class="calendar-wrapper">
      <app-calendar [events]="calendarEvents" [editable]="true" [selectable]="true"
        (slotSelected)="onSlotSelected($event)" (eventClicked)="onEventClicked($event)">
      </app-calendar>
    </div>
  </div>

  <!-- Availability Modal -->
  <div class="modal-overlay" [class.active]="showAvailabilityModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h5 class="modal-title">Add Availability</h5>
        <button class="modal-close" (click)="closeAvailabilityModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Day of Week</label>
          <select class="form-select" [(ngModel)]="availabilityForm.dayOfWeek">
            <option *ngFor="let day of daysOfWeek" [value]="day">{{ day }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Start Time</label>
          <input type="time" class="form-input" [(ngModel)]="availabilityForm.startTime">
        </div>

        <div class="form-group">
          <label class="form-label">End Time</label>
          <input type="time" class="form-input" [(ngModel)]="availabilityForm.endTime">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-cancel" (click)="closeAvailabilityModal()">Cancel</button>
        <button class="btn btn-save" (click)="saveAvailability()">Save Availability</button>
      </div>
    </div>
  </div>
</div>
