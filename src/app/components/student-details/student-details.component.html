<div class="details-container">
    <div class="header">
        <h1>My Student Profile</h1>
        <p>Manage your personal information and academic details</p>
    </div>

    <div *ngIf="isLoading" class="loading">Loading profile...</div>

    <form *ngIf="!isLoading && profile" (ngSubmit)="saveProfile()">
        <div class="form-grid">
            <h3 class="section-title">Personal Information</h3>

            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" [(ngModel)]="formData.fullName" name="fullName" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" [(ngModel)]="formData.phoneNumber" name="phoneNumber" class="form-input">
            </div>

            <h3 class="section-title">Academic Details</h3>

            <div class="form-group">
                <label class="form-label">School</label>
                <input type="text" [(ngModel)]="formData.school" name="school" class="form-input"
                    placeholder="Enter your school name">
            </div>

            <div class="form-group">
                <label class="form-label">Grade Level</label>
                <select [(ngModel)]="formData.gradeLevel" name="gradeLevel" class="form-select">
                    <option *ngFor="let grade of gradeOptions" [value]="grade">{{ grade }}</option>
                </select>
            </div>

            <h3 class="section-title">Guardian Information</h3>

            <div class="form-group">
                <label class="form-label">Parent/Guardian Name</label>
                <input type="text" [(ngModel)]="formData.parentName" name="parentName" class="form-input"
                    placeholder="Parent or Guardian Name">
            </div>

            <div class="form-group">
                <label class="form-label">Parent Contact Number</label>
                <input type="tel" [(ngModel)]="formData.parentContact" name="parentContact" class="form-input"
                    placeholder="Parent's Contact Number">
            </div>

            <div class="actions full-width">
                <button type="submit" class="btn btn-primary" [disabled]="isSaving">
                    {{ isSaving ? 'Saving...' : 'Save Changes' }}
                </button>
            </div>
        </div>
    </form>
</div>
